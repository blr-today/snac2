name: Image

on:
  push:
    branches: [event-publication]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    # Images are tagged with the run number, which only ever goes up
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Build and push
      env:
        GH_TOKEN: ${{ github.token }}
        ACTOR: ${{ github.actor }}
        IMAGE: ghcr.io/${{ github.repository }}
        TAG: ${{ github.run_number }}
        ALPINE: 3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
      run: |
        echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        docker build \
          --build-arg "ALPINE_VERSION=$ALPINE" \
          --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
          --label "org.opencontainers.image.revision=$GITHUB_SHA" \
          -t "$IMAGE:$TAG" .
        docker push "$IMAGE:$TAG"
        echo "Pushed \`$IMAGE:$TAG\` from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
